services:
  - type: web
    name: learning-journey-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend/deploy && pip install -r requirements.txt
    startCommand: cd backend/deploy && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
